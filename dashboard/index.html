<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backflow gateway</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Backflow</h1>
  <span class="tag">safety gateway · pump station 1</span>
  <span id="status" class="down">connecting…</span>
  <span class="spacer"></span>
  <form id="login" hidden autocomplete="off">
    <input id="pw" type="password" placeholder="admin password" aria-label="Admin password" required>
    <button class="ghost" type="submit">Log in</button>
    <span id="login-err"></span>
  </form>
  <span id="who" hidden>admin</span>
  <span id="admin-tools" hidden></span>
  <button id="logout" class="ghost" hidden>Log out</button>
</header>
<main>
  <section id="col-feed" aria-label="Commands">
    <h2>Commands</h2>
    <ul id="feed"></ul>
    <p id="empty" class="empty">No commands yet.</p>
  </section>
  <section id="col-plant" aria-label="Plant" hidden></section>
  <section id="col-right">
    <div id="phone" aria-label="Operator phone">
      <h2>Operator's phone</h2>
      <div id="inbox"></div>
      <p id="no-texts" class="empty">No texts.</p>
      <p id="need-login" class="empty" hidden>Log in as admin to see the texts and reply.</p>
    </div>
    <div id="agent" aria-label="Agent activity">
      <h2>Agent</h2>
      <ol id="steps"></ol>
      <p id="no-steps" class="empty">The agent wakes up when a command is held.</p>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
