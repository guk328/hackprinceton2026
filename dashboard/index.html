<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backflow gateway</title>
<style>
  :root { --bg:#0f1419; --fg:#e6e6e6; --muted:#8a949e; --row:#1a2129;
          --allow:#1f9d55; --hold:#d98e04; --deny:#d1342f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 16px;
           border-bottom:1px solid #2a333d; }
  h1 { margin:0; font-size:18px; }
  #status { font-size:13px; color:var(--muted); }
  #status.live::before { content:"● "; color:var(--allow); }
  #status.down::before { content:"● "; color:var(--deny); }
  #feed { list-style:none; margin:0; padding:12px 16px; display:grid; gap:8px; }
  .ev { display:grid; grid-template-columns:110px 1fr auto; gap:4px 14px; align-items:center;
        background:var(--row); border-radius:8px; padding:10px 14px; }
  .ev.new { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background:#33404d; } }
  .badge { grid-row:span 2; text-align:center; font-weight:800; font-size:20px;
           letter-spacing:.04em; padding:12px 0; border-radius:6px; color:#fff; }
  .ALLOW { background:var(--allow); } .HOLD { background:var(--hold); } .DENY { background:var(--deny); }
  .what { font-size:17px; font-weight:600; overflow-wrap:anywhere; }
  .what .val { font-family: ui-monospace, Menlo, monospace; }
  .meta { color:var(--muted); font-size:13px; text-align:right; white-space:nowrap; }
  .reason { grid-column:2 / 4; color:#c9d1d9; overflow-wrap:anywhere; }
  .empty { color:var(--muted); padding:24px 16px; }
  @media (max-width:560px) {
    .ev { grid-template-columns:80px 1fr; }
    .badge { font-size:16px; }
    .meta { grid-column:2; text-align:left; white-space:normal; }
    .reason { grid-column:1 / 3; }
  }
</style>
</head>
<body>
<header>
  <h1>Backflow gateway</h1>
  <span id="status" class="down">connecting…</span>
</header>
<ul id="feed"></ul>
<p id="empty" class="empty">No events yet.</p>
<script src="app.js"></script>
</body>
</html>
