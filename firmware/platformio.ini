; Backflow station firmware. Board: 30-pin ESP32 DevKit (ESP32-WROOM-32, pins labelled D26 etc.).
; The nodemcu-32s board definition is the same chip and LED pin; it works unchanged.
[platformio]
default_envs = station

[env]
platform = espressif32@8.0.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

[env:station]
extra_scripts = pre:tools/patch_modbus_lib.py
lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.13.0
    emelianov/modbus-esp8266@4.1.0

; One-part bench test: toggles the relay inputs so you can hear the click.
;   python -m platformio run -e relaytest -t upload --upload-port COM9
[env:relaytest]
build_src_filter = -<*> +<../tools/relay_test/>
